<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turnos · Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F0;
    --surface:#FFFFFF;
    --ink:#1C2A27;
    --muted:#66766F;
    --line:#DCE3E0;
    --primary:#1F5C52;
    --primary-dark:#153E37;
    --primary-tint:#E4EEEC;
    --amber:#B4791F;
    --amber-tint:#FBF0DE;
    --coral:#B14332;
    --coral-tint:#FBE9E5;
    --sage:#3E7A5C;
    --sage-tint:#E4F1E9;
    --gray:#7A8781;
    --gray-tint:#EDF0EE;
    --radius:10px;
    --shadow:0 1px 2px rgba(28,42,39,.06), 0 8px 24px -12px rgba(28,42,39,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3,.brand{font-family:'Fraunces',serif;}
  button{font-family:inherit;}
  a{color:inherit;}

  /* ── LOGIN ─────────────────────────────────────────────── */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:
      radial-gradient(600px 400px at 15% 10%, rgba(31,92,82,.10), transparent 60%),
      radial-gradient(500px 380px at 85% 90%, rgba(31,92,82,.08), transparent 60%),
      var(--bg);
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    padding:36px 32px 30px;
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:"";
    position:absolute; top:0; left:0; right:0; height:5px;
    background:linear-gradient(90deg,var(--primary),var(--sage));
  }
  .badge-mark{
    width:44px;height:44px;border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:20px;
    margin-bottom:18px;
  }
  .login-card h1{
    font-size:26px;font-weight:600;margin:0 0 4px;color:var(--primary-dark);
    letter-spacing:-.01em;
  }
  .login-card p.sub{margin:0 0 26px;color:var(--muted);font-size:14px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:12px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
    border-color:var(--primary);
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 18px;
    border-radius:8px;
    border:1px solid transparent;
    font-size:14px;font-weight:600;
    cursor:pointer;
    transition:filter .12s ease;
  }
  .btn:hover{filter:brightness(0.94);}
  .btn:active{filter:brightness(0.88);}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-block{width:100%;}
  .btn-ghost{background:transparent;color:var(--primary-dark);border-color:var(--line);}
  .btn-danger{background:var(--coral-tint);color:var(--coral);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .error-banner{
    background:var(--coral-tint);color:var(--coral);
    border:1px solid rgba(177,67,50,.25);
    padding:10px 12px;border-radius:8px;
    font-size:13px;margin-bottom:16px;
    display:none;
  }
  .error-banner.show{display:block;}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5;}
  .hint code{background:var(--primary-tint);padding:1px 5px;border-radius:4px;font-size:11.5px;}

  /* ── APP SHELL ─────────────────────────────────────────── */
  #app{display:none;min-height:100vh;grid-template-columns:220px 1fr;}
  #app.show{display:grid;}
  aside{
    background:var(--primary-dark);
    color:#EAF1EF;
    padding:22px 14px;
    display:flex;flex-direction:column;
  }
  .brand{
    color:#fff;font-size:19px;font-weight:600;
    display:flex;align-items:center;gap:9px;
    margin-bottom:28px;padding:0 8px;
  }
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--sage);
    box-shadow:0 0 0 3px rgba(62,122,92,.35);}
  nav.tabs{display:flex;flex-direction:column;gap:2px;flex:1;}
  nav.tabs button{
    all:unset;cursor:pointer;
    padding:10px 12px;border-radius:8px;
    font-size:14px;font-weight:500;
    color:rgba(234,241,239,.72);
    display:flex;align-items:center;gap:10px;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.06);color:#fff;}
  nav.tabs button.active{background:rgba(255,255,255,.12);color:#fff;}
  nav.tabs button .idx{
    font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.65;
  }
  .user-box{
    border-top:1px solid rgba(255,255,255,.12);
    padding-top:14px;margin-top:10px;
  }
  .user-box .who{font-size:13px;font-weight:600;color:#fff;}
  .user-box .role{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.05em;
    color:var(--sage);text-transform:uppercase;
  }
  .user-box button{
    margin-top:10px;all:unset;display:block;cursor:pointer;font-size:12.5px;
    color:rgba(234,241,239,.6);
  }
  .user-box button:hover{color:#fff;}

  main{padding:32px 40px;max-width:1180px;}
  .view-header{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:22px;flex-wrap:wrap;gap:12px;
  }
  .view-header h2{font-size:26px;font-weight:600;margin:0;color:var(--primary-dark);}
  .view-header .count{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    margin-left:10px;
  }

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .toolbar input, .toolbar select{
    padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    background:#fff;font-family:inherit;
  }

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);
  }
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--primary-tint);}
  .empty-row td{color:var(--muted);text-align:center;padding:36px;font-size:14px;}

  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 10px 3px 8px;border-radius:99px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    letter-spacing:.03em;text-transform:uppercase;
  }
  .pill .d{width:6px;height:6px;border-radius:50%;}
  .pill-amber{background:var(--amber-tint);color:var(--amber);}
  .pill-amber .d{background:var(--amber);}
  .pill-sage{background:var(--sage-tint);color:var(--sage);}
  .pill-sage .d{background:var(--sage);}
  .pill-coral{background:var(--coral-tint);color:var(--coral);}
  .pill-coral .d{background:var(--coral);}
  .pill-gray{background:var(--gray-tint);color:var(--gray);}
  .pill-gray .d{background:var(--gray);}
  .pill-primary{background:var(--primary-tint);color:var(--primary-dark);}
  .pill-primary .d{background:var(--primary);}

  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  /* Modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(20,30,28,.45);
    align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:14px;max-width:520px;width:100%;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.35);
    padding:26px 26px 22px;
  }
  .modal h3{margin:0 0 4px;font-size:20px;color:var(--primary-dark);}
  .modal p.sub{margin:0 0 18px;color:var(--muted);font-size:13px;}
  .modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .close-x{
    all:unset;cursor:pointer;float:right;color:var(--muted);font-size:20px;line-height:1;
  }
  .patient-pick{
    border:1px solid var(--line);border-radius:8px;max-height:160px;overflow:auto;margin-top:6px;
  }
  .patient-pick div{padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);}
  .patient-pick div:last-child{border-bottom:none;}
  .patient-pick div:hover{background:var(--primary-tint);}
  .selected-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--primary-tint);
    color:var(--primary-dark);padding:6px 10px;border-radius:8px;font-size:13px;margin-top:6px;
  }
  .selected-chip button{all:unset;cursor:pointer;color:var(--coral);font-weight:700;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--primary-dark);color:#fff;
    padding:12px 18px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);
    display:none;z-index:60;
  }
  .toast.show{display:block;}
  .field-msg{color:var(--coral);font-size:12px;margin-top:4px;}
  ::placeholder{color:#A9B3AF;}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="badge-mark">T</div>
    <h1>Turnos Médicos</h1>
    <p class="sub">Iniciá sesión para gestionar pacientes, médicos y turnos.</p>
    <div class="error-banner" id="loginError"></div>
    <form id="loginForm">
      <div class="field">
        <label for="loginUser">Usuario</label>
        <input id="loginUser" autocomplete="username" placeholder="admin" required>
      </div>
      <div class="field">
        <label for="loginPass">Contraseña</label>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Ingresar</button>
    </form>
    <p class="hint">
      Usuario de prueba (si corriste <code>seed-admin.sql</code>): <code>admin</code> / <code>admin123</code><br>
      La API debe estar corriendo en <code id="apiBaseLabel"></code>.
    </p>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────── -->
<div id="app">
  <aside>
    <div class="brand"><span class="dot"></span> Turnos</div>
    <nav class="tabs" id="tabs">
      <button data-view="appointments"><span class="idx">01</span> Turnos</button>
      <button data-view="patients"><span class="idx">02</span> Pacientes</button>
      <button data-view="doctors"><span class="idx">03</span> Médicos</button>
      <button data-view="specialties"><span class="idx">04</span> Especialidades</button>
    </nav>
    <div class="user-box">
      <div class="who" id="whoName">—</div>
      <div class="role" id="whoRole">—</div>
      <button id="myAccountBtn">Mi cuenta ⚙</button>
      <button id="logoutBtn">Cerrar sesión →</button>
    </div>
  </aside>
  <main>
    <div class="error-banner" id="appError" style="max-width:640px;"></div>
    <div id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API_BASE = '';
document.getElementById('apiBaseLabel').textContent = window.location.origin;

/* ============================================================
   ESTADO
   ============================================================ */
let state = {
  token: localStorage.getItem('turnos_token') || null,
  username: localStorage.getItem('turnos_username') || null,
  role: localStorage.getItem('turnos_role') || null,
  view: 'appointments',
  specialties: [],
  doctors: [],
};

/* ============================================================
   HELPERS DE API
   ============================================================ */
async function api(path, options = {}) {
  const headers = Object.assign(
    { 'Content-Type': 'application/json' },
    options.headers || {}
  );
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;

  let res;
  try {
    res = await fetch(API_BASE + path, { ...options, headers });
  } catch (e) {
    throw new Error('No se pudo conectar con la API. ¿Está corriendo el backend?');
  }

  if (res.status === 401) {
    logout();
    throw new Error('Sesión expirada o inválida. Iniciá sesión de nuevo.');
  }

  if (res.status === 204) return null;

  let body = null;
  const text = await res.text();
  if (text) { try { body = JSON.parse(text); } catch (e) { body = null; } }

  if (!res.ok) {
    let msg = 'Ocurrió un error (' + res.status + ')';
    if (body) {
      if (body.message) msg = body.message;
      else if (body.fields) {
        msg = Object.entries(body.fields).map(([k, v]) => k + ': ' + v).join(' · ');
      } else if (body.error) msg = body.error;
    }
    if (res.status === 403) msg = 'No tenés permisos para hacer esto (rol: ' + (state.role || '?') + ').';
    throw new Error(msg);
  }
  return body;
}

function fullName(p) { return (p.firstName || '') + ' ' + (p.lastName || ''); }
function fmtDate(d) { if (!d) return '—'; return d; }
function fmtTime(t) { if (!t) return '—'; return t.slice(0,5); }

/* ============================================================
   AUTH
   ============================================================ */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Ingresando...';

  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;

  try {
    const data = await api('/api/auth/login', {
      method: 'POST',
      body: JSON.stringify({ username, password })
    });
    state.token = data.token;
    state.username = data.username;
    state.role = data.role;
    localStorage.setItem('turnos_token', data.token);
    localStorage.setItem('turnos_username', data.username);
    localStorage.setItem('turnos_role', data.role);
    enterApp();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
});

function logout() {
  state.token = null; state.username = null; state.role = null;
  localStorage.removeItem('turnos_token');
  localStorage.removeItem('turnos_username');
  localStorage.removeItem('turnos_role');
  document.getElementById('app').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'flex';
}
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('myAccountBtn').addEventListener('click', openMyAccountModal);

function openMyAccountModal() {
  openModal(`
    <button class="close-x" onclick="closeModal()">&times;</button>
    <h3>Mi cuenta</h3>
    <p class="sub">Cambiá tu nombre de usuario y/o contraseña. Necesitás tu contraseña actual.</p>
    <form id="accountForm">
      <div class="field">
        <label>Nuevo nombre de usuario</label>
        <input name="newUsername" placeholder="Dejalo vacío para no cambiarlo" value="${escapeHtml(state.username || '')}">
      </div>
      <div class="field">
        <label>Nueva contraseña</label>
        <input name="newPassword" type="password" placeholder="Dejalo vacío para no cambiarla">
      </div>
      <div class="field">
        <label>Contraseña actual (obligatoria)</label>
        <input name="currentPassword" type="password" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  `);
  document.getElementById('accountForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const newUsername = fd.get('newUsername')?.trim();
    const newPassword = fd.get('newPassword')?.trim();
    try {
      const updated = await api('/api/account/me', {
        method: 'PATCH',
        body: JSON.stringify({
          currentPassword: fd.get('currentPassword'),
          newUsername: (newUsername && newUsername !== state.username) ? newUsername : null,
          newPassword: newPassword || null
        })
      });
      state.username = updated.username;
      localStorage.setItem('turnos_username', updated.username);
      document.getElementById('whoName').textContent = state.username;
      closeModal();
      toast('Cuenta actualizada. La próxima vez ingresá con los nuevos datos.');
    } catch (err) {
      closeModal();
      showAppError(err.message);
    }
  });
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('whoName').textContent = state.username;
  document.getElementById('whoRole').textContent = state.role;
  setView('appointments');
}

/* ============================================================
   NAV / ROUTER
   ============================================================ */
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  setView(btn.dataset.view);
});

function setView(view) {
  state.view = view;
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('appError').classList.remove('show');
  const renderers = {
    appointments: renderAppointments,
    patients: renderPatients,
    doctors: renderDoctors,
    specialties: renderSpecialties,
  };
  renderers[view]();
}

function showAppError(msg) {
  const el = document.getElementById('appError');
  el.textContent = msg; el.classList.add('show');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================================================
   MODAL HELPERS
   ============================================================ */
function openModal(html) {
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeModal();
});

/* ============================================================
   ESPECIALIDADES
   ============================================================ */
async function loadSpecialties() {
  state.specialties = await api('/api/specialties');
  return state.specialties;
}

async function renderSpecialties() {
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="view-header">
      <h2>Especialidades</h2>
      <button class="btn btn-primary" id="newSpecialtyBtn">+ Nueva especialidad</button>
    </div>
    <div class="card"><table>
      <thead><tr><th>Nombre</th><th>Descripción</th><th>Estado</th></tr></thead>
      <tbody id="specialtiesBody"><tr class="empty-row"><td colspan="3">Cargando…</td></tr></tbody>
    </table></div>
  `;
  document.getElementById('newSpecialtyBtn').addEventListener('click', () => {
    openModal(`
      <button class="close-x" onclick="closeModal()">&times;</button>
      <h3>Nueva especialidad</h3>
      <p class="sub">Se usa para clasificar a los médicos.</p>
      <form id="specialtyForm">
        <div class="field"><label>Nombre</label><input name="name" required placeholder="Cardiología"></div>
        <div class="field"><label>Descripción</label><input name="description" placeholder="Opcional"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Crear</button>
        </div>
      </form>
    `);
    document.getElementById('specialtyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api('/api/specialties', {
          method: 'POST',
          body: JSON.stringify({ name: fd.get('name'), description: fd.get('description') || null })
        });
        closeModal(); toast('Especialidad creada'); renderSpecialties();
      } catch (err) { showAppError(err.message); closeModal(); }
    });
  });

  try {
    const list = await loadSpecialties();
    const body = document.getElementById('specialtiesBody');
    if (!list.length) {
      body.innerHTML = `<tr class="empty-row"><td colspan="3">Todavía no hay especialidades cargadas.</td></tr>`;
      return;
    }
    body.innerHTML = list.map(s => `
      <tr>
        <td><strong>${escapeHtml(s.name)}</strong></td>
        <td>${escapeHtml(s.description || '—')}</td>
        <td>${pill(s.active ? 'sage' : 'gray', s.active ? 'Activa' : 'Inactiva')}</td>
      </tr>
    `).join('');
  } catch (err) { showAppError(err.message); }
}

/* ============================================================
   MÉDICOS
   ============================================================ */
async function loadDoctors(specialtyId) {
  const qs = specialtyId ? ('?specialtyId=' + specialtyId) : '';
  state.doctors = await api('/api/doctors' + qs);
  return state.doctors;
}

async function renderDoctors() {
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="view-header"><h2>Médicos</h2>

/* ============================================================
   TURNOS

const STATUS_PILL = {
  PENDING:   ['amber', 'Pendiente'],
  CONFIRMED: ['sage',  'Confirmado'],
  CANCELLED: ['coral', 'Cancelado'],
  COMPLETED: ['gray',  'Completado'],
  NO_SHOW:   ['coral', 'Ausente'],
  RESCHEDULED:['amber','Reprogramado'],

const TYPE_LABELS = {
  FIRST_VISIT: 'Primera visita',
  FOLLOW_UP:   'Seguimiento',
  EMERGENCY:   'Urgencia',
  CHECKUP:     'Control',
};

let calState = { doctorId: null, year: 0, month: 0 }; // month: 0-11
let calDaysWithAppts = {}; // { 'YYYY-MM-DD': count }

/* ── Calendario mensual: qué días tiene turnos el médico ──── */
async function paintCalendar() {
  const card = document.getElementById('calendarCard');
  if (!calState.doctorId) {
    card.innerHTML = `<p style="margin:0;font-size:13px;color:var(--muted);">Elegí un médico para ver qué días tiene turnos.</p>`;
    return;
  }
  card.innerHTML = `<p style="margin:0;font-size:13px;color:var(--muted);">Cargando calendario…</p>`;

  const first = new Date(calState.year, calState.month, 1);
  const last  = new Date(calState.year, calState.month + 1, 0);
  const from = first.toISOString().slice(0,10);
  const to   = last.toISOString().slice(0,10);

  try {
    const list = await api('/api/turnos/rango?doctorId=' + calState.doctorId + '&from=' + from + '&to=' + to);
    calDaysWithAppts = {};
    list.forEach(a => { calDaysWithAppts[a.appointmentDate] = (calDaysWithAppts[a.appointmentDate] || 0) + 1; });
  } catch (err) {
    card.innerHTML = `<p style="margin:0;font-size:13px;color:var(--coral);">No se pudo cargar el calendario.</p>`;
    return;
  }
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const card = document.getElementById('calendarCard');
  const monthNames = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const first = new Date(calState.year, calState.month, 1);
  const startOffset = (first.getDay() + 6) % 7; // lunes=0
  const daysInMonth = new Date(calState.year, calState.month + 1, 0).getDate();
  const selectedDate = document.getElementById('apptDate')?.value;
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calState.year}-${String(calState.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = calDaysWithAppts[dateStr] || 0;
    const isSelected = dateStr === selectedDate;
    const isToday = dateStr === todayStr;
    cells += `
      <button type="button" onclick="selectCalendarDay('${dateStr}')"
        style="all:unset;cursor:pointer;text-align:center;padding:6px 0;border-radius:7px;font-size:12.5px;
          ${isSelected ? 'background:var(--primary);color:#fff;' : isToday ? 'background:var(--primary-tint);color:var(--primary-dark);font-weight:600;' : 'color:var(--ink);'}">
        <div>${d}</div>
        ${count > 0 ? `<div style="width:5px;height:5px;border-radius:50%;background:${isSelected?'#fff':'var(--amber)'};margin:2px auto 0;"></div>` : '<div style="height:7px;"></div>'}
      </button>`;
  }

  card.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <button type="button" class="btn btn-ghost btn-sm" onclick="navigateMonth(-1)">‹</button>
      <strong style="font-size:13px;">${monthNames[calState.month]} ${calState.year}</strong>
      <button type="button" class="btn btn-ghost btn-sm" onclick="navigateMonth(1)">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;color:var(--muted);text-align:center;margin-bottom:4px;">
      <div>L</div><div>M</div><div>M</div><div>J</div><div>V</div><div>S</div><div>D</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;">${cells}</div>
    <p style="margin:10px 0 0;font-size:11px;color:var(--muted);">● día con turnos</p>
  `;
}

function navigateMonth(delta) {
  calState.month += delta;
  if (calState.month < 0) { calState.month = 11; calState.year--; }
  if (calState.month > 11) { calState.month = 0; calState.year++; }
  paintCalendar();
}

function selectCalendarDay(dateStr) {
  document.getElementById('apptDate').value = dateStr;
  renderCalendarGrid();
  paintAppointments();
}

/* ── Grilla de horarios ocupados del día ─────────────────── */
function renderDayGrid(list) {
  const gridCard = document.getElementById('dayGridCard');
  const grid = document.getElementById('dayGrid');
  if (!list.length) { gridCard.style.display = 'none'; return; }
  gridCard.style.display = 'block';

  const occupied = list
    .filter(a => a.status !== 'CANCELLED')
    .map(a => ({ start: a.startTime.slice(0,5), end: a.endTime ? a.endTime.slice(0,5) : a.startTime.slice(0,5) }));

  grid.innerHTML = occupied.map(o => `
    <div class="pill pill-coral" style="font-size:11.5px;">
      <span class="d"></span>${o.start}–${o.end}
    </div>
  `).join('') || `<span style="font-size:13px;color:var(--muted);">Sin turnos ese día.</span>`;
}

async function paintAppointments() {
  const doctorId = document.getElementById('apptDoctor').value;
  const date = document.getElementById('apptDate').value;
  const body = document.getElementById('apptBody');
  document.getElementById('dayGridCard').style.display = 'none';
  if (!doctorId || !date) {
    body.innerHTML = `<tr class="empty-row"><td colspan="5">Elegí un médico y una fecha para ver los turnos.</td></tr>`;
    return;
  }
  body.innerHTML = `<tr class="empty-row"><td colspan="5">Cargando…</td></tr>`;
  try {
    const list = await api('/api/turnos?doctorId=' + doctorId + '&date=' + date);
    renderDayGrid(list);
    if (!list.length) {
      body.innerHTML = `<tr class="empty-row"><td colspan="5">No hay turnos para ese médico en esa fecha.</td></tr>`;
      return;
    }
    body.innerHTML = list.map(a => {
      const [tone, label] = STATUS_PILL[a.status] || ['gray', a.status];
      const typeLabel = TYPE_LABELS[a.type] || a.type;
      const actions = [];
      if (a.status === 'PENDING') {
        actions.push(`<button class="btn btn-sm btn-ghost" onclick="confirmAppt('${a.id}')">Confirmar</button>`);
        actions.push(`<button class="btn btn-sm btn-danger" onclick="cancelAppt('${a.id}')">Cancelar</button>`);
      } else if (a.status === 'CONFIRMED') {
        actions.push(`<button class="btn btn-sm btn-ghost" onclick="completeAppt('${a.id}')">Completar</button>`);
        actions.push(`<button class="btn btn-sm btn-ghost" onclick="noShowAppt('${a.id}')">Ausente</button>`);
        actions.push(`<button class="btn btn-sm btn-danger" onclick="cancelAppt('${a.id}')">Cancelar</button>`);
      }
      return `
        <tr>
          <td class="mono">${fmtTime(a.startTime)}–${fmtTime(a.endTime)}</td>
          <td><strong>${escapeHtml(a.patient ? fullName(a.patient) : '—')}</strong></td>
          <td>${escapeHtml(typeLabel)}</td>
          <td>${pill(tone, label)}</td>
          <td class="row-actions">${actions.join('')}</td>
        </tr>`;
    }).join('');
  } catch (err) { showAppError(err.message); body.innerHTML = `<tr class="empty-row"><td colspan="5">—</td></tr>`; }
}

async function confirmAppt(id){ await apptAction(id, '/confirmar', 'PATCH', null, 'Turno confirmado'); }
async function completeAppt(id){ await apptAction(id, '/completar', 'PATCH', null, 'Turno completado'); }
async function noShowAppt(id){ await apptAction(id, '/ausente', 'PATCH', null, 'Turno marcado como ausente'); }
async function cancelAppt(id){
  const reason = prompt('Motivo de la cancelación:');
  if (reason === null) return;
  await apptAction(id, '/cancelar', 'PATCH', { cancellationReason: reason || 'Sin especificar' }, 'Turno cancelado');
}
async function apptAction(id, suffix, method, payload, okMsg) {
  try {
    await api('/api/turnos/' + id + suffix, {
      method, body: payload ? JSON.stringify(payload) : undefined
    });
    toast(okMsg); paintAppointments(); if (calState.doctorId) paintCalendar();
  } catch (err) { showAppError(err.message); }
}

    searchInput.value = '';
  });

  document.getElementById('apptForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!selectedPatient) { showAppError('Elegí un paciente de la lista antes de crear el turno.'); return; }
    const fd = new FormData(e.target);
    try {
      await api('/api/turnos', {
        method: 'POST',
        body: JSON.stringify({
          patientId: selectedPatient,
          doctorId: fd.get('doctorId'),
          officeId: null,
          healthInsuranceId: null,
          appointmentDate: fd.get('appointmentDate'),
          startTime: fd.get('startTime') + ':00',
          type: fd.get('type'),
          notes: fd.get('notes') || null
        })
      });
      closeModal(); toast('Turno creado'); paintAppointments(); if (calState.doctorId) paintCalendar();
    } catch (err) { showAppError(err.message); closeModal(); }
  });
}

/* ============================================================
   UTILS
   ============================================================ */
function pill(tone, label) {
  return `<span class="pill pill-${tone}"><span class="d"></span>${escapeHtml(label)}</span>`;
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ============================================================
   INIT
   ============================================================ */
if (state.token) { enterApp(); }
</script>
